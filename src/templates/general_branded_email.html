{% load inlinecss %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title></title>

</head>
{% inlinecss "general_email.css" %}

<body>
  <div class="email-container">
    <div class="email-header">
      <img class="img-logo" src="{{ assets_base_url }}/email_assets/ResearchHubLogo.png" alt="ResearchHub" />
      {% if subject %}
      <div class="header">
        {{ subject }}
      </div>
      {% endif %}
    </div>
    <div class="content">
      <div class="body"{% if preserve_linebreaks %} style="white-space: pre-line;"{% endif %}>
        {{ body }}
      </div>
      {% if cta_url %}
      <div class="cta-wrapper">
        <a class="cta-button" href="{{ cta_url }}">
          {{ cta_label|default:"View" }}
        </a>
      </div>
      {% endif %}
    </div>
    <div class="footer">
      {% if opt_out %}
      <a href="{{ opt_out }}">Unsubscribe</a>
      {% endif %}
    </div>
  </div>
</body>

</html>

{% endinlinecss %}
