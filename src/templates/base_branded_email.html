{% load inlinecss %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{% block title %}{{ subject }}{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @media (max-width: {% block mobile_breakpoint %}600px{% endblock %}) {
      .canvas { padding: 16px 8px !important; }
      .container { width: 100% !important; }
      .card-inner { padding: 24px 24px 28px !important; }
      .title { font-size: 22px !important; line-height: 28px !important; }
      .cta-button { display: block !important; text-align: center !important; }
      {% block mobile_styles %}{% endblock %}
    }
  </style>
</head>
{% inlinecss "general_email.css" %}

<body>
  <table class="canvas" role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table class="container" role="presentation" width="{% block width %}560{% endblock %}" cellpadding="0" cellspacing="0">
          <tr>
            <td>
              <table class="card" role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td class="accent-bar" height="4">&nbsp;</td>
                </tr>
                <tr>
                  <td class="card-inner">
                    {% block content %}{% endblock %}
                  </td>
                </tr>
              </table>
              <table class="footer" role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    {% if opt_out %}<a href="{{ opt_out }}">Unsubscribe</a> &nbsp;&middot;&nbsp; {% endif %}&copy; {% now "Y" %} ResearchHub
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>

{% endinlinecss %}
