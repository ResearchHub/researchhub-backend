name: Deployment
run-name: Deploy to ${{ github.event.inputs.deploy_env || 'staging' }} (${{ github.event.inputs.git_ref || github.event.workflow_run.head_sha }})


on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Select the target environment"
        required: false
        default: staging
        type: choice
        options:
          - staging
          - prod
      git_ref:
        description: "Enter Git hash or branch"
        required: false
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.deploy_env || 'staging' }}
  cancel-in-progress: false

env:
  # Prod deploys are announced as shipping
  DEPLOY_STARTED: "${{ github.event.inputs.deploy_env == 'prod' && ':ship: Shipping' || ':rocket: Deploying' }}"
  DEPLOY_SUCCEEDED: "${{ github.event.inputs.deploy_env == 'prod' && ':white_check_mark: Shipped' || ':white_check_mark: Deployed' }}"
  DEPLOY_FAILED: "${{ github.event.inputs.deploy_env == 'prod' && ':x: Failed to ship' || ':x: Failed to deploy' }}"
  DEPLOY_REF: "`${{ github.event.inputs.git_ref }}`"
  DEPLOY_TARGET: "to *${{ github.event.inputs.deploy_env }}* (started by ${{ github.actor }}) · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      git_ref: ${{ github.event.inputs.git_ref || github.event.workflow_run.head_sha }}
    secrets: inherit

  migrate:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/database-migration.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_ref: ${{ needs.build.outputs.git_sha }}
    secrets: inherit

  deploy-api:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: api
    secrets: inherit

  deploy-celery-beat:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-beat
    secrets: inherit

  deploy-celery-worker:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-worker
    secrets: inherit

  deploy-celery-worker-lite:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-worker-lite
    secrets: inherit

  deploy-celery-flower:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-flower
    secrets: inherit

  notify-start:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.compare.outputs.commit }}
      behind_note: ${{ steps.compare.outputs.note }}
      ts: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Compare with main
        id: compare
        # The notification goes out without the commit and note if the comparison fails
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.event.inputs.git_ref || github.sha }}
        run: |
          # Compared from the ref, so base_commit is the deployed commit and ahead_by is how far main is ahead
          gh api "repos/$GITHUB_REPOSITORY/compare/$GIT_REF...main" --jq '
            "commit= (<\(.base_commit.html_url)|\(.base_commit.sha[:7])>)",
            "note=" + if .ahead_by > 0 then " · :warning: \(.ahead_by) commit(s) behind `main`" else "" end
          ' >> "$GITHUB_OUTPUT"

      - name: Post deployment start to Slack
        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: ${{ toJSON(format('{0} {1}{2} {3}{4}', env.DEPLOY_STARTED, env.DEPLOY_REF, steps.compare.outputs.commit, env.DEPLOY_TARGET, steps.compare.outputs.note)) }}

  notify-end:
    needs:
      - notify-start
      - build
      - migrate
      - deploy-api
      - deploy-celery-beat
      - deploy-celery-worker
      - deploy-celery-worker-lite
      - deploy-celery-flower
    # always, so failed and cancelled deploys update the message too
    if: always() && needs.notify-start.outputs.ts
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Update Slack message with deployment result
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            ts: "${{ needs.notify-start.outputs.ts }}"
            text: ${{ toJSON(format('{0} {1}{2} {3}{4}', (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && env.DEPLOY_FAILED || env.DEPLOY_SUCCEEDED, env.DEPLOY_REF, needs.notify-start.outputs.commit, env.DEPLOY_TARGET, needs.notify-start.outputs.behind_note)) }}
