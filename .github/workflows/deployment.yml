name: Deployment
run-name: Deploy to ${{ github.event.inputs.deploy_env || 'staging' }} (${{ github.event.inputs.git_ref || github.event.workflow_run.head_sha }})


on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Select the target environment"
        required: false
        default: staging
        type: choice
        options:
          - staging
          - prod
      git_ref:
        description: "Enter Git hash or branch"
        required: false
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.deploy_env || 'staging' }}
  cancel-in-progress: false

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      git_ref: ${{ github.event.inputs.git_ref || github.event.workflow_run.head_sha }}
    secrets: inherit

  migrate:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/database-migration.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_ref: ${{ needs.build.outputs.git_sha }}
    secrets: inherit

  deploy-api:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: api
    secrets: inherit

  deploy-celery-beat:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-beat
    secrets: inherit

  deploy-celery-worker:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-worker
    secrets: inherit

  deploy-celery-worker-lite:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-worker-lite
    secrets: inherit

  deploy-celery-flower:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployment-ecs.yml
    with:
      deploy_env: ${{ github.event.inputs.deploy_env || 'staging' }}
      git_sha: ${{ needs.migrate.outputs.git_sha }}
      service: celery-flower
    secrets: inherit
