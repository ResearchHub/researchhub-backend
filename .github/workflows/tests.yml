name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The test DB is built from models, so this job proves the migrations apply.
  migrations:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_DB: test_researchhub
          POSTGRES_USER: rh_developer
          POSTGRES_PASSWORD: not_secure
          DB_PORT: 5432
          DB_HOST: localhost
          DB_USER: rh_developer
          DB_PASS: not_secure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Check for missing database migrations
        env:
          APP_ENV: test
        working-directory: ./src
        run: |
          cp config/ci/* config
          uv run --frozen python manage.py makemigrations --check

      - name: Apply migrations to an empty database
        env:
          APP_ENV: test
        working-directory: ./src
        run: |
          cp config/ci/* config
          uv run --frozen python manage.py migrate

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_DB: test_researchhub
          POSTGRES_USER: rh_developer
          POSTGRES_PASSWORD: not_secure
          DB_PORT: 5432
          DB_HOST: localhost
          DB_USER: rh_developer
          DB_PASS: not_secure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Run Formatter
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "./src"
          args: "format --check --diff"

      - name: Run Linter
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "./src"

      - name: Run Tests
        env:
          APP_ENV: test
          COVERAGE_PROCESS_START: ../pyproject.toml
        working-directory: ./src
        run: |
          cp config/ci/* config
          uv run --frozen python manage.py collectstatic --noinput
          uv run --frozen coverage run manage.py test --keepdb --verbosity=2 --parallel auto
          uv run --frozen coverage combine
          uv run --frozen coverage xml -o coverage.xml

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./src/coverage.xml
