name: Build

on:
  workflow_call:
    inputs:
      git_ref:
        description: "Git hash or branch to build"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Enter Git hash or branch"
        required: false
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CONTAINER_REPOSITORY: ${{ vars.CONTAINER_REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # required for requesting JWT token from AWS

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}

      - name: Get Git SHA
        id: git_sha
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "$GIT_SHA" > src/git_hash.txt
          SHORT_GIT_SHA=${GIT_SHA:0:7}
          echo "short=$SHORT_GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "long=$GIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.CONTAINER_REPOSITORY }}:${{ steps.git_sha.outputs.long }}
          cache-from: type=gha,scope=researchhub-backend-arm64
          cache-to: type=gha,mode=max,scope=researchhub-backend-arm64

      - name: Summary
        env:
          GIT_REF: ${{ inputs.git_ref || github.ref_name }}
          GIT_SHA: ${{ steps.git_sha.outputs.long }}
          IMAGE: ${{ env.CONTAINER_REPOSITORY }}:${{ steps.git_sha.outputs.long }}
        run: |
          {
            echo "Given Git ref: \`$GIT_REF\`"
            echo "Commit: \`$GIT_SHA\`"
            echo "Image: \`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
