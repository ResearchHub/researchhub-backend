name: Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "0 3 * * *" # Daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: Audit locked dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Export locked dependencies
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Run pip-audit
        run: |
          uvx --python 3.14 --from pip-audit==2.10.1 pip-audit \
            --requirement "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off
