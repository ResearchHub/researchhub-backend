name: ECS Deployment

on:
  workflow_call:
    inputs:
      deploy_env:
        description: "Target environment"
        required: false
        default: staging
        type: string
      git_sha:
        description: "Commit to deploy. The caller must have verified that its image exists."
        required: true
        type: string
      service:
        description: "ECS service to deploy, e.g. api or celery-beat"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Select the target environment"
        required: false
        default: staging
        type: choice
        options:
          - staging
          - prod
      git_ref:
        description: "Git hash or branch to deploy. Its image must have been built."
        required: true
        type: string
      service:
        description: "Select the ECS service to deploy"
        required: true
        default: api
        type: choice
        options:
          - api
          - celery-beat

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CONTAINER_REPOSITORY: ${{ vars.CONTAINER_REPOSITORY }}
  DEPLOY_ROLE_ARN: ${{ vars[inputs.deploy_env == 'prod' && 'PROD_DEPLOY_ROLE_ARN' || 'STAGING_DEPLOY_ROLE_ARN'] }}
  DEPLOY_PARAMETER: /researchhub/${{ inputs.deploy_env }}/applications/${{ inputs.service }}/deploy

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required for requesting JWT token from AWS

    steps:
      - name: Checkout application repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha || inputs.git_ref }}

      - name: Get Git SHA
        id: git_sha
        run: |
          echo "long=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify container image exists
        env:
          IMAGE_TAG: ${{ steps.git_sha.outputs.long }}
        run: |
          REPOSITORY_NAME=${CONTAINER_REPOSITORY#*/}
          aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            > /dev/null

      - name: Assume ${{ inputs.deploy_env }} deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-ecs-deployment-session
          role-chaining: true
          role-duration-seconds: 3600
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Read deployment configuration
        id: config
        run: |
          config=$(
            aws ssm get-parameter \
              --name "$DEPLOY_PARAMETER" \
              --query Parameter.Value \
              --output text
          )
          {
            echo "cluster=$(jq -r .cluster <<<"$config")"
            echo "service=$(jq -r .service <<<"$config")"
            echo "family=$(jq -r .taskDefinition <<<"$config")"
            echo "container=$(jq -r .container <<<"$config")"
          } >> "$GITHUB_OUTPUT"

      - name: Render task definition with the image to deploy
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition-family: ${{ steps.config.outputs.family }}
          container-name: ${{ steps.config.outputs.container }}
          image: ${{ env.CONTAINER_REPOSITORY }}:${{ steps.git_sha.outputs.long }}

      - name: Deploy ${{ inputs.deploy_env }} Backend - ${{ inputs.service }}
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ steps.config.outputs.cluster }}
          service: ${{ steps.config.outputs.service }}
          wait-for-service-stability: true
          wait-for-minutes: 20
          wait-max-delay-seconds: 15

      - name: Summary
        env:
          SERVICE: ${{ inputs.service }}
          GIT_SHA: ${{ steps.git_sha.outputs.long }}
          IMAGE: ${{ env.CONTAINER_REPOSITORY }}:${{ steps.git_sha.outputs.long }}
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          {
            echo "Service: \`$SERVICE\`"
            echo "Commit: \`$GIT_SHA\`"
            echo "Image: \`$IMAGE\`"
            echo "Task definition: \`$TASK_DEFINITION_ARN\`"
          } >> "$GITHUB_STEP_SUMMARY"
